<body>
    <button class="settings-button" onclick="openSettings()">⚙️</button>
    
    <div class="container">
        <div class="header">
            <div class="title">🔥 Calorie Tracker AI</div>
            <div class="subtitle">Traccia le tue calorie con intelligenza artificiale</div>
        </div>

        <div class="progress-section">
            <div class="progress-title">Calorie Oggi</div>
            <div class="circle-progress">
                <svg width="200" height="200">
                    <circle class="circle-bg" cx="100" cy="100" r="80"></circle>
                    <circle class="circle-progress-bar" id="progressCircle" cx="100" cy="100" r="80"></circle>
                </svg>
                <div class="progress-text">
                    <div class="calories-number" id="currentCalories">0</div>
                    <div class="calories-label">di <span id="dailyLimit">2000</span></div>
                </div>
            </div>
            <div id="warningMessage" class="warning" style="display: none;"></div>
        </div>

        <button class="camera-button" onclick="openCamera()">
            📸 Scatta Foto del Pasto
        </button>

        <div class="meals-section">
            <div class="meals-title">Pasti di Oggi</div>
            <div id="mealsList">
                <div class="empty-state">
                    <div class="empty-icon">🍽️</div>
                    <div>Nessun pasto registrato oggi</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Camera -->
    <div id="cameraModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Nuovo Pasto</div>
                <button class="close-button" onclick="closeCamera()">×</button>
            </div>
            
            <div id="photoOptions" class="photo-options">
                <button class="option-button" onclick="capturePhoto()">
                    📷 Scatta Foto
                </button>
                <button class="option-button secondary" onclick="selectPhoto()">
                    🖼️ Scegli dalla Galleria
                </button>
                <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
                <input type="file" id="galleryInput" accept="image/*" onchange="handleFileSelect(event)">
            </div>

            <div id="previewSection" class="preview-section" style="display: none;">
                <img id="previewImage" class="preview-image" alt="Preview">
                <button class="analyze-button" onclick="analyzeImage()">
                    ✨ Analizza con AI
                </button>
                <button class="manual-button" onclick="showManualEntry()">
                    ✍️ Inserimento Manuale
                </button>
                <button class="manual-button" onclick="resetCamera()">
                    🔄 Scatta Nuova Foto
                </button>
            </div>

            <div id="loadingSection" class="loading" style="display: none;">
                <div class="spinner"></div>
                <div>Analisi in corso con AI...</div>
            </div>

            <div id="errorSection" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Impostazioni</div>
                <button class="close-button" onclick="closeSettings()">×</button>
            </div>

            <div class="api-key-section">
                <label class="api-key-label">🔑 API Key Anthropic</label>
                <input type="password" id="apiKeyInput" class="form-input" placeholder="sk-ant-api03-...">
                <button class="option-button" style="margin-top: 10px;" onclick="saveApiKey()">
                    💾 Salva API Key
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Soglia Giornaliera (calorie)</label>
                <input type="number" id="limitInput" class="form-input" placeholder="2000">
                <div class="preset-buttons">
                    <button class="preset-button" onclick="setLimit(1500)">1500</button>
                    <button class="preset-button" onclick="setLimit(2000)">2000</button>
                    <button class="preset-button" onclick="setLimit(2500)">2500</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="weeklyAvg">0</div>
                    <div class="stat-label">Media Settimanale</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayTotal">0</div>
                    <div class="stat-label">Totale Oggi</div>
                </div>
            </div>

            <button class="analyze-button" style="margin-top: 20px; background: #ef4444;" onclick="resetTodayData()">
                🗑️ Reset Dati Giornalieri
            </button>
        </div>
    </div>

    <!-- Modal Manual Entry -->
    <div id="manualModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Inserimento Manuale</div>
                <button class="close-button" onclick="closeManual()">×</button>
            </div>

            <div class="form-group">
                <label class="form-label">Nome Piatto</label>
                <input type="text" id="mealNameInput" class="form-input" placeholder="Es: Spaghetti alla carbonara">
            </div>

            <div class="form-group">
                <label class="form-label">Calorie</label>
                <input type="number" id="mealCaloriesInput" class="form-input" placeholder="Es: 650">
            </div>

            <button class="analyze-button" onclick="saveManualMeal()">
                💾 Salva Pasto
            </button>
        </div>
    </div>

    <script>
        // State
        let currentImage = null;
        let meals = [];
        let dailyLimit = 2000;
        let apiKey = '';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateUI();
        });

        function loadData() {
            const saved = localStorage.getItem('calorieTrackerData');
            if (saved) {
                const data = JSON.parse(saved);
                meals = data.meals || [];
                dailyLimit = data.dailyLimit || 2000;
                apiKey = data.apiKey || '';
            }

            // Clean old meals (older than 30 days)
            const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
            meals = meals.filter(meal => meal.timestamp > thirtyDaysAgo);
            saveData();
        }

        function saveData() {
            localStorage.setItem('calorieTrackerData', JSON.stringify({
                meals,
                dailyLimit,
                apiKey
            }));
        }

        function getTodayMeals() {
            const today = new Date().toDateString();
            return meals.filter(meal => new Date(meal.timestamp).toDateString() === today);
        }

        function updateUI() {
            const todayMeals = getTodayMeals();
            const totalCalories = todayMeals.reduce((sum, meal) => sum + meal.calories, 0);
            const progress = Math.min(totalCalories / dailyLimit, 1);

            // Update progress circle
            document.getElementById('currentCalories').textContent = Math.round(totalCalories);
            document.getElementById('dailyLimit').textContent = dailyLimit;

            const circle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 80;
            const offset = circumference - (progress * circumference);
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = offset;

            // Change color based on progress
            if (totalCalories > dailyLimit) {
                circle.style.stroke = '#ef4444';
            } else if (totalCalories > dailyLimit * 0.9) {
                circle.style.stroke = '#f59e0b';
            } else {
                circle.style.stroke = '#10b981';
            }

            // Update warning
            const warningMsg = document.getElementById('warningMessage');
            if (totalCalories > dailyLimit) {
                warningMsg.textContent = '⚠️ Soglia superata!';
                warningMsg.style.display = 'block';
            } else if (totalCalories > dailyLimit * 0.9) {
                warningMsg.textContent = '⚡ Attenzione, vicino al limite';
                warningMsg.style.display = 'block';
            } else {
                warningMsg.style.display = 'none';
            }

            // Update meals list
            const mealsList = document.getElementById('mealsList');
            if (todayMeals.length === 0) {
                mealsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div>Nessun pasto registrato oggi</div>
                    </div>
                `;
            } else {
                mealsList.innerHTML = todayMeals.map((meal, index) => `
                    <div class="meal-item">
                        ${meal.image ? `<img src="${meal.image}" class="meal-image" alt="${meal.name}">` : '<div class="meal-image">🍽️</div>'}
                        <div class="meal-info">
                            <div class="meal-name">${meal.name}</div>
                            <div class="meal-calories">${Math.round(meal.calories)} cal</div>
                            <div class="meal-time">${new Date(meal.timestamp).toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'})}</div>
                        </div>
                        <button class="meal-delete" onclick="deleteMeal(${index})">🗑️</button>
                    </div>
                `).join('');
            }

            // Update settings
            document.getElementById('limitInput').value = dailyLimit;
            document.getElementById('todayTotal').textContent = Math.round(totalCalories);
            document.getElementById('weeklyAvg').textContent = Math.round(getWeeklyAverage());
        }

        function getWeeklyAverage() {
            const weekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const weekMeals = meals.filter(meal => meal.timestamp > weekAgo);
            if (weekMeals.length === 0) return 0;
            const total = weekMeals.reduce((sum, meal) => sum + meal.calories, 0);
            return total / 7;
        }

        // Camera functions
        function openCamera() {
            document.getElementById('cameraModal').classList.add('active');
            resetCamera();
        }

        function closeCamera() {
            document.getElementById('cameraModal').classList.remove('active');
            resetCamera();
        }

        function resetCamera() {
            currentImage = null;
            document.getElementById('photoOptions').style.display = 'flex';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'none';
        }

        function capturePhoto() {
            document.getElementById('fileInput').click();
        }

        function selectPhoto() {
            document.getElementById('galleryInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                document.getElementById('previewImage').src = currentImage;
                document.getElementById('photoOptions').style.display = 'none';
                document.getElementById('previewSection').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!apiKey) {
                showError('⚠️ Inserisci prima la tua API Key nelle impostazioni!');
                return;
            }

            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('errorSection').style.display = 'none';

            try {
                const base64Image = currentImage.split(',')[1];

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: 'image/jpeg',
                                        data: base64Image
                                    }
                                },
                                {
                                    type: 'text',
                                    text: `Analizza questa immagine di cibo e fornisci una stima delle calorie.

Rispondi SOLO nel seguente formato JSON (senza markdown, solo il JSON):
{
    "nome_piatto": "nome del piatto in italiano",
    "calorie": numero_stimato_calorie,
    "descrizione": "breve descrizione degli ingredienti visibili"
}

Esempio:
{
    "nome_piatto": "Spaghetti alla carbonara",
    "calorie": 650,
    "descrizione": "Pasta con uova, guanciale e pecorino"
}`
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Errore API: ${response.status}`);
                }

                const data = await response.json();
                const textContent = data.content.find(c => c.type === 'text')?.text;
                
                if (!textContent) {
                    throw new Error('Risposta non valida dall\'API');
                }

                // Clean and parse JSON
                const cleanedJSON = textContent
                    .replace(/```json/g, '')
                    .replace(/```/g, '')
                    .trim();

                const result = JSON.parse(cleanedJSON);

                // Add meal
                addMeal(result.nome_piatto, result.calorie, currentImage);
                closeCamera();
                updateUI();

            } catch (error) {
                console.error('Error:', error);
                showError(`❌ Errore: ${error.message}`);
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('previewSection').style.display = 'block';
            }
        }

        function showError(message) {
            const errorSection = document.getElementById('errorSection');
            errorSection.textContent = message;
            errorSection.style.display = 'block';
            setTimeout(() => {
                errorSection.style.display = 'none';
            }, 5000);
        }

        function addMeal(name, calories, image) {
            meals.unshift({
                name,
                calories: Number(calories),
                timestamp: Date.now(),
                image
            });
            saveData();
        }

        function deleteMeal(index) {
            const todayMeals = getTodayMeals();
            const mealToDelete = todayMeals[index];
            const globalIndex = meals.findIndex(m => m.timestamp === mealToDelete.timestamp);
            if (globalIndex !== -1) {
                meals.splice(globalIndex, 1);
                saveData();
                updateUI();
            }
        }

        // Manual entry
        function showManualEntry() {
            document.getElementById('manualModal').classList.add('active');
        }

        function closeManual() {
            document.getElementById('manualModal').classList.remove('active');
        }

        function saveManualMeal() {
            const name = document.getElementById('mealNameInput').value;
            const calories = document.getElementById('mealCaloriesInput').value;

            if (!name || !calories) {
                alert('Inserisci nome e calorie');
                return;
            }

            addMeal(name, Number(calories), currentImage);
            closeManual();
            closeCamera();
            updateUI();

            document.getElementById('mealNameInput').value = '';
            document.getElementById('mealCaloriesInput').value = '';
        }

        // Settings
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('apiKeyInput').value = apiKey;
            updateUI();
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value;
            saveData();
            alert('✅ API Key salvata!');
        }

        function setLimit(limit) {
            dailyLimit = limit;
            document.getElementById('limitInput').value = limit;
            saveData();
            updateUI();
        }

        function resetTodayData() {
            if (confirm('Vuoi eliminare tutti i pasti di oggi?')) {
                const today = new Date().toDateString();
                meals = meals.filter(meal => new Date(meal.timestamp).toDateString() !== today);
                saveData();
                updateUI();
            }
        }

        // Install prompt for PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>
</body>
</html>
